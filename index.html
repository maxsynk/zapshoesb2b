<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAP SHOES - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden; display: flex; }
        
        /* TELA DE LOGIN */
        #login-screen {
            position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%); z-index: 10;
        }
        .login-container { background: rgba(20,20,20,0.8); padding: 40px; border-radius: 20px; border: 2px solid #8A2BE2; box-shadow: 0 0 20px rgba(138,43,226,0.6); width: 380px; text-align: center; backdrop-filter: blur(10px); }
        .logo { width: 100px; border-radius: 50%; margin-bottom: 15px; box-shadow: 0 0 15px rgba(138,43,226,0.4); }
        h1 { font-size: 28px; background: linear-gradient(90deg, #8A2BE2, #d580ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #8A2BE2; }
        input { width: 100%; padding: 15px 15px 15px 45px; background: #0d0d0d; border: 1px solid #333; border-radius: 10px; color: #fff; }
        input:focus { outline: none; border-color: #8A2BE2; box-shadow: 0 0 10px rgba(138,43,226,0.3); }
        button.btn-entrar { width: 100%; padding: 15px; background: linear-gradient(90deg, #8A2BE2, #a633ff); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }

        /* DASHBOARD */
        #dashboard-screen { display: none; width: 100%; height: 100%; }
        .sidebar { width: 250px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .sidebar .logo-small { width: 60px; border-radius: 50%; margin-bottom: 20px; display: block; }
        .menu-item { padding: 15px; color: #aaa; text-decoration: none; display: flex; align-items: center; gap: 10px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background: rgba(138,43,226,0.1); color: #8A2BE2; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn-logout { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid #333; position: relative; }
        .card h3 { font-size: 14px; color: #888; margin-bottom: 10px; }
        .card .value { font-size: 32px; font-weight: 700; color: #fff; }
        .card .icon-bg { position: absolute; right: 20px; top: 20px; font-size: 40px; color: rgba(138,43,226,0.1); }
        
        .action-bar { display: flex; gap: 15px; margin-bottom: 30px; }
        .btn-primary { background: #8A2BE2; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: #a633ff; box-shadow: 0 0 15px rgba(138,43,226,0.4); }

        .table-container { background: #151515; border-radius: 15px; border: 1px solid #333; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #888; font-size: 13px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        td { padding: 15px 0; border-bottom: 1px solid #222; color: #ddd; }
        .status { padding: 5px 10px; border-radius: 20px; font-size: 12px; background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN (A que já fizemos) -->
    <div id="login-screen">
        <div class="login-container">
            <img src="logo.png" alt="ZAP SHOES" class="logo">
            <h1>ZAP SHOES</h1>
            <p style="color:#aaa; font-size:12px; margin-bottom:20px; letter-spacing:2px;">PORTAL DO VENDEDOR</p>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="email" id="email" placeholder="E-mail" value="vendedor@teste.com">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Senha" value="senha123">
            </div>
            <button class="btn-entrar" onclick="login()"><i class="fa-solid fa-arrow-right-to-bracket"></i> ENTRAR</button>
        </div>
    </div>

    <!-- TELA DA DASHBOARD (Escondida inicialmente) -->
    <div id="dashboard-screen">
        <div class="sidebar">
            <img src="logo.png" alt="ZAP" class="logo-small">
            <a class="menu-item active"><i class="fa-solid fa-chart-pie"></i> Visão Geral</a>
            <a class="menu-item"><i class="fa-solid fa-users"></i> Meus Clientes</a>
            <a class="menu-item"><i class="fa-solid fa-box-open"></i> Pedidos</a>
            <a class="menu-item"><i class="fa-solid fa-gear"></i> Configurações</a>
        </div>
        
        <div class="main-content">
            <div class="header-top">
                <h2>Olá, <span id="user-name-display">Vendedor</span>! 👋</h2>
                <div class="user-info">
                    <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Sair</button>
                </div>
            </div>

            <div class="cards-grid">
                <div class="card">
                    <h3>Total de Clientes</h3>
                    <div class="value">0</div>
                    <i class="fa-solid fa-users icon-bg"></i>
                </div>
                <div class="card">
                    <h3>Pedidos no Mês</h3>
                    <div class="value">0</div>
                    <i class="fa-solid fa-shopping-cart icon-bg"></i>
                </div>
                <div class="card">
                    <h3>Faturamento</h3>
                    <div class="value">R$ 0,00</div>
                    <i class="fa-solid fa-dollar-sign icon-bg"></i>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-primary"><i class="fa-solid fa-plus"></i> Novo Cliente</button>
                <button class="btn-primary" style="background:#333;"><i class="fa-solid fa-file-invoice"></i> Novo Pedido</button>
            </div>

            <div class="table-container">
                <h3 style="margin-bottom:15px;">Últimos Pedidos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Valor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Nenhum pedido recente</td>
                            <td>-</td>
                            <td>-</td>
                            <td><span class="status">Aguardando</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const workerUrl = 'https://zapshoesb2b.maxcalcadosmax.workers.dev/login';

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // A MÁGICA ACONTECE AQUI: Esconde o login e mostra a Dashboard
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'flex';
                    document.getElementById('user-name-display').innerText = data.user.name;
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Erro ao conectar com o servidor.');
            }
        }

        function logout() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
