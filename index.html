<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAP SHOES - Clientes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #09040e; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        
        /* TELA DE LOGIN */
        #login-screen { position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%); z-index: 10; }
        .login-container { background: rgba(20,20,20,0.8); padding: 50px; border-radius: 20px; border: 2px solid #8A2BE2; box-shadow: 0 0 20px rgba(138,43,226,0.6); width: 420px; text-align: center; }
        .logo { width: 120px; border-radius: 50%; margin-bottom: 20px; }
        h1.login-title { font-size: 32px; background: linear-gradient(90deg, #8A2BE2, #d580ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #8A2BE2; }
        .login-container input { width: 100%; padding: 18px 18px 18px 50px; background: #0d0d0d; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 16px; }
        .btn-entrar { width: 100%; padding: 18px; background: linear-gradient(90deg, #8A2BE2, #a633ff); border: none; border-radius: 10px; color: white; font-size: 18px; font-weight: 700; cursor: pointer; }

        /* NAVBAR SUPERIOR */
        #dashboard-screen { display: none; flex-direction: column; height: 100%; }
        .navbar { background: #110917; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a163a; }
        .navbar-menu { display: flex; gap: 30px; }
        .navbar-menu a { color: #888; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .navbar-menu a.active { color: #b026ff; border-bottom: 2px solid #b026ff; padding-bottom: 15px; margin-bottom: -16px; }
        
        /* CABEÇALHO DA PÁGINA */
        .page-header { text-align: center; padding: 30px 0; }
        .page-header h1 { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(176, 38, 255, 0.5); letter-spacing: 2px; }
        .page-header span { color: #b026ff; }

        /* CONTAINER PRINCIPAL */
        .main-content { flex: 1; padding: 0 40px 40px 40px; overflow-y: auto; }
        .card-form { background: #110917; border: 1px solid #2a163a; border-radius: 15px; padding: 30px; max-width: 1200px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #2a163a; padding-bottom: 15px; }
        .form-header h2 { font-size: 16px; color: #b026ff; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        /* GRID DE CAMPOS */
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .form-group input, .form-group textarea { background: #0a0510; border: 1px solid #2a163a; padding: 15px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #b026ff; box-shadow: 0 0 10px rgba(176,38,255,0.2); }
        .form-group.full-width { grid-column: span 3; }
        
        /* RADIO BUTTONS */
        .radio-group { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ccc; cursor: pointer; text-transform: none; }
        .radio-group input[type="radio"] { accent-color: #b026ff; width: 18px; height: 18px; }

        .btn-salvar { background: #b026ff; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: 0.3s; margin-top: 20px; }
        .btn-salvar:hover { background: #c855ff; box-shadow: 0 0 15px rgba(176,38,255,0.6); }

        /* LISTA DE CLIENTES (TABELA) */
        .table-container { max-width: 1200px; margin: 40px auto 0; background: #110917; border-radius: 15px; border: 1px solid #2a163a; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #888; font-size: 12px; padding-bottom: 15px; border-bottom: 1px solid #2a163a; text-transform: uppercase; }
        td { padding: 15px 0; border-bottom: 1px solid #1a0b2e; color: #ddd; font-size: 14px; }

        .btn-logout { color: #ff4444; background: transparent; border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-container">
            <img src="logo.png" alt="ZAP SHOES" class="logo">
            <h1 class="login-title">ZAP SHOES</h1>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="email" id="email" placeholder="E-mail" required onkeydown="if(event.key === 'Enter') login()">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Senha" required onkeydown="if(event.key === 'Enter') login()">
            </div>
            <button class="btn-entrar" onclick="login()">ENTRAR</button>
        </div>
    </div>

    <!-- SISTEMA LOGADO -->
    <div id="dashboard-screen">
        <!-- Navbar -->
        <div class="navbar">
            <div class="navbar-menu">
                <a href="#"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="#"><i class="fa-solid fa-box"></i> Produtos</a>
                <a href="#"><i class="fa-solid fa-cart-shopping"></i> Pedidos</a>
                <a href="#" class="active"><i class="fa-solid fa-users"></i> Clientes</a>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Sair</button>
        </div>

        <!-- Cabeçalho -->
        <div class="page-header">
            <h1>ZAP <span>SHOES</span></h1>
            <p style="color:#888; letter-spacing: 5px; font-size: 12px; margin-top: 5px;">CRM PARA CALÇADOS</p>
        </div>

        <div class="main-content">
            <!-- FORMULÁRIO DE CADASTRO -->
            <div class="card-form">
                <div class="form-header">
                    <h2><i class="fa-solid fa-plus"></i> CADASTRAR CLIENTE</h2>
                </div>
                
                <form id="form-cliente" onsubmit="event.preventDefault(); salvarCliente();">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nome *</label>
                            <input type="text" id="cli-nome" placeholder="Nome do cliente ou loja" required>
                        </div>
                        <div class="form-group">
                            <label>CPF/CNPJ</label>
                            <input type="text" id="cli-cpf" placeholder="000.000.000-00">
                        </div>
                        <div class="form-group">
                            <label>Telefone/WhatsApp</label>
                            <input type="text" id="cli-telefone" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="cli-cep" placeholder="00000-000">
                        </div>
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="cli-endereco" placeholder="Rua/Av.">
                        </div>
                        <div class="form-group">
                            <label>Número</label>
                            <input type="text" id="cli-numero" placeholder="Nº">
                        </div>

                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="cli-bairro" placeholder="Bairro">
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="cli-cidade" placeholder="Cidade">
                        </div>
                        <div class="form-group">
                            <label>UF</label>
                            <input type="text" id="cli-uf" placeholder="SP" maxlength="2">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label>Tipo de Cliente</label>
                        <div class="radio-group">
                            <label><input type="radio" name="tipo_cliente" value="comum" checked> Cliente comum</label>
                            <label><input type="radio" name="tipo_cliente" value="revendedor"> Revendedor registrado</label>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Ponto de Referência (Apelido, bar do seu Zé, referência...)</label>
                            <input type="text" id="cli-referencia" placeholder="Ex: Deixar no Bar do Seu Zé / Apelido: João do Mercado">
                        </div>
                        <div class="form-group full-width">
                            <label>Observações</label>
                            <textarea id="cli-obs" rows="3" placeholder="Anotações sobre o cliente..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-salvar"><i class="fa-solid fa-floppy-disk"></i> SALVAR CLIENTE</button>
                </form>
            </div>

            <!-- TABELA DE CLIENTES -->
            <div class="table-container">
                <h3 style="margin-bottom:15px; color:#b026ff; font-size:16px;">Meus Clientes</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>CPF/CNPJ</th>
                            <th>Cidade/Bairro</th>
                        </tr>
                    </thead>
                    <tbody id="lista-clientes">
                        <tr><td colspan="4" style="text-align:center; color:#888;">Nenhum cliente cadastrado ainda.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = "";
        const workerBaseUrl = 'https://zapshoesb2b.maxcalcadosmax.workers.dev'; 

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${workerBaseUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    currentUserId = data.user.id; 
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'flex';
                    carregarClientes(); 
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Erro ao conectar com o servidor.');
            }
        }

        function logout() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            currentUserId = "";
            document.getElementById('form-cliente').reset();
            document.getElementById('lista-clientes').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">Nenhum cliente cadastrado ainda.</td></tr>';
        }

        async function salvarCliente() {
            // Coleta todos os campos do formulário
            const name = document.getElementById('cli-nome').value;
            const phone = document.getElementById('cli-telefone').value;
            const cpf_cnpj = document.getElementById('cli-cpf').value;
            const cep = document.getElementById('cli-cep').value;
            const address = document.getElementById('cli-endereco').value;
            const number = document.getElementById('cli-numero').value;
            const neighborhood = document.getElementById('cli-bairro').value;
            const city = document.getElementById('cli-cidade').value;
            const state = document.getElementById('cli-uf').value;
            const client_type = document.querySelector('input[name="tipo_cliente"]:checked').value;
            const reference_point = document.getElementById('cli-referencia').value;
            const notes = document.getElementById('cli-obs').value;

            try {
                const response = await fetch(`${workerBaseUrl}/clients`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        seller_id: currentUserId, 
                        name, phone, cpf_cnpj, cep, address, number, neighborhood, city, state, client_type, reference_point, notes 
                    })
                });

                if (response.ok) {
                    alert("Cliente salvo com sucesso!");
                    document.getElementById('form-cliente').reset(); // Limpa o formulário
                    carregarClientes(); // Atualiza a tabela
                } else {
                    alert("Erro ao salvar cliente.");
                }
            } catch (error) {
                alert("Erro de conexão.");
            }
        }

        async function carregarClientes() {
            try {
                const response = await fetch(`${workerBaseUrl}/clients?seller_id=${currentUserId}`);
                const clientes = await response.json();

                const tbody = document.getElementById('lista-clientes');
                tbody.innerHTML = ''; 

                if (clientes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">Nenhum cliente cadastrado ainda.</td></tr>';
                    return;
                }

                clientes.forEach(cliente => {
                    const tr = document.createElement('tr');
                    // Monta o endereço na tabela
                    const enderecoCompleto = [cliente.city, cliente.neighborhood].filter(Boolean).join(' / ');
                    
                    tr.innerHTML = `
                        <td><strong>${cliente.name}</strong></td>
                        <td>${cliente.phone || '-'}</td>
                        <td>${cliente.cpf_cnpj || '-'}</td>
                        <td>${enderecoCompleto || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Erro ao carregar clientes:", error);
            }
        }
    </script>
</body>
</html>
