<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAP SHOES - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden; display: flex; }
        
        /* TELA DE LOGIN */
        #login-screen { position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%); z-index: 10; }
        .login-container { background: rgba(20,20,20,0.8); padding: 50px; border-radius: 20px; border: 2px solid #8A2BE2; box-shadow: 0 0 20px rgba(138,43,226,0.6); width: 420px; text-align: center; backdrop-filter: blur(10px); }
        .logo { width: 120px; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 0 15px rgba(138,43,226,0.4); }
        h1.login-title { font-size: 32px; background: linear-gradient(90deg, #8A2BE2, #d580ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; letter-spacing: 2px; }
        p.subtitle { color: #aaa; font-size: 13px; margin-bottom: 30px; letter-spacing: 3px; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #8A2BE2; font-size: 18px; }
        input.login-input { width: 100%; padding: 18px 18px 18px 50px; background: #0d0d0d; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 16px; transition: 0.3s; }
        input.login-input:focus { outline: none; border-color: #8A2BE2; box-shadow: 0 0 10px rgba(138,43,226,0.3); }
        button.btn-entrar { width: 100%; padding: 18px; background: linear-gradient(90deg, #8A2BE2, #a633ff); border: none; border-radius: 10px; color: white; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        button.btn-entrar:hover { background: linear-gradient(90deg, #a633ff, #8A2BE2); box-shadow: 0 0 20px rgba(138,43,226,0.6); }

        /* DASHBOARD LAYOUT */
        #dashboard-screen { display: none; width: 100%; height: 100%; }
        
        /* SIDEBAR */
        .sidebar { width: 250px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .sidebar .logo-small { width: 60px; border-radius: 50%; margin-bottom: 20px; display: block; box-shadow: 0 0 10px rgba(138,43,226,0.4); }
        .menu-item { padding: 15px; color: #aaa; text-decoration: none; display: flex; align-items: center; gap: 10px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.3s; font-weight: 600; font-size: 14px; }
        .menu-item:hover, .menu-item.active { background: rgba(138,43,226,0.1); color: #8A2BE2; }
        
        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn-logout { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-logout:hover { background: rgba(255, 68, 68, 0.1); }

        /* CARDS DE RESUMO */
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid #333; position: relative; }
        .card h3 { font-size: 14px; color: #888; margin-bottom: 10px; font-weight: 600; }
        .card .value { font-size: 32px; font-weight: 700; color: #fff; }
        .card .icon-bg { position: absolute; right: 20px; top: 20px; font-size: 40px; color: rgba(138,43,226,0.1); }

        /* FORMULÁRIO DE CLIENTE */
        .form-container { background: #151515; border: 1px solid #333; border-radius: 15px; padding: 30px; margin-bottom: 30px; }
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .form-header h2 { font-size: 16px; color: #8A2BE2; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .form-group input, .form-group textarea { background: #0a0a0a; border: 1px solid #333; padding: 15px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #8A2BE2; box-shadow: 0 0 10px rgba(138,43,226,0.3); }
        .form-group.full-width { grid-column: span 3; }

        .btn-salvar { background: #8A2BE2; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-salvar:hover { background: #a633ff; box-shadow: 0 0 15px rgba(138,43,226,0.6); }

        /* TABELA DE CLIENTES */
        .table-container { background: #151515; border-radius: 15px; border: 1px solid #333; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #888; font-size: 13px; padding-bottom: 15px; border-bottom: 1px solid #333; text-transform: uppercase; }
        td { padding: 15px 0; border-bottom: 1px solid #222; color: #ddd; font-size: 14px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-container">
            <img src="logo.png" alt="ZAP SHOES" class="logo">
            <h1 class="login-title">ZAP SHOES</h1>
            <p class="subtitle">PORTAL DO VENDEDOR</p>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="email" id="email" class="login-input" placeholder="E-mail" required onkeydown="if(event.key === 'Enter') login()">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" class="login-input" placeholder="Senha" required onkeydown="if(event.key === 'Enter') login()">
            </div>
            <button class="btn-entrar" onclick="login()"><i class="fa-solid fa-arrow-right-to-bracket"></i> ENTRAR</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <img src="logo.png" alt="ZAP" class="logo-small">
            <a class="menu-item"><i class="fa-solid fa-chart-pie"></i> Visão Geral</a>
            <a class="menu-item active"><i class="fa-solid fa-users"></i> Meus Clientes</a>
            <a class="menu-item"><i class="fa-solid fa-box-open"></i> Pedidos</a>
        </div>
        
        <!-- CONTEÚDO PRINCIPAL -->
        <div class="main-content">
            <div class="header-top">
                <h2>Olá, <span id="user-name-display">Vendedor</span>! 👋</h2>
                <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Sair</button>
            </div>

            <!-- CARDS DE RESUMO -->
            <div class="cards-grid">
                <div class="card">
                    <h3>Total de Clientes</h3>
                    <div class="value" id="total-clientes">0</div>
                    <i class="fa-solid fa-users icon-bg"></i>
                </div>
                <div class="card">
                    <h3>Pedidos no Mês</h3>
                    <div class="value">0</div>
                    <i class="fa-solid fa-shopping-cart icon-bg"></i>
                </div>
                <div class="card">
                    <h3>Faturamento</h3>
                    <div class="value">R$ 0,00</div>
                    <i class="fa-solid fa-dollar-sign icon-bg"></i>
                </div>
            </div>

            <!-- FORMULÁRIO DE CADASTRO (COMPLETO) -->
            <div class="form-container">
                <div class="form-header">
                    <h2><i class="fa-solid fa-plus"></i> CADASTRAR CLIENTE</h2>
                </div>
                
                <form id="form-cliente" onsubmit="event.preventDefault(); salvarCliente();">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nome *</label>
                            <input type="text" id="cli-nome" placeholder="Nome do cliente ou loja" required>
                        </div>
                        <div class="form-group">
                            <label>CPF/CNPJ</label>
                            <input type="text" id="cli-cpf" placeholder="000.000.000-00">
                        </div>
                        <div class="form-group">
                            <label>Telefone/WhatsApp</label>
                            <input type="text" id="cli-telefone" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="cli-cep" placeholder="00000-000">
                        </div>
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="cli-endereco" placeholder="Rua/Av.">
                        </div>
                        <div class="form-group">
                            <label>Número</label>
                            <input type="text" id="cli-numero" placeholder="Nº">
                        </div>

                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="cli-bairro" placeholder="Bairro">
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="cli-cidade" placeholder="Cidade">
                        </div>
                        <div class="form-group">
                            <label>UF</label>
                            <input type="text" id="cli-uf" placeholder="SP" maxlength="2">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Ponto de Referência (Apelido, bar do seu Zé, referência...)</label>
                            <input type="text" id="cli-referencia" placeholder="Ex: Deixar no Bar do Seu Zé / Apelido: João do Mercado">
                        </div>
                        <div class="form-group full-width">
                            <label>Observações</label>
                            <textarea id="cli-obs" rows="3" placeholder="Anotações sobre o cliente..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-salvar"><i class="fa-solid fa-floppy-disk"></i> SALVAR CLIENTE</button>
                </form>
            </div>

            <!-- TABELA DE CLIENTES -->
            <div class="table-container">
                <h3 style="margin-bottom:15px; color:#8A2BE2; font-size:16px;">Meus Clientes Cadastrados</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>CPF/CNPJ</th>
                            <th>Cidade/Bairro</th>
                        </tr>
                    </thead>
                    <tbody id="lista-clientes">
                        <tr><td colspan="4" style="text-align:center; color:#888;">Nenhum cliente cadastrado ainda.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = "";
        const workerBaseUrl = 'https://zapshoesb2b.maxcalcadosmax.workers.dev'; 

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${workerBaseUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    currentUserId = data.user.id; 
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'flex';
                    document.getElementById('user-name-display').innerText = data.user.name;
                    
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                    
                    carregarClientes(); 
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Erro ao conectar com o servidor.');
            }
        }

        function logout() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            currentUserId = "";
            document.getElementById('form-cliente').reset();
            document.getElementById('lista-clientes').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">Nenhum cliente cadastrado ainda.</td></tr>';
            document.getElementById('total-clientes').innerText = "0";
        }

        async function salvarCliente() {
            const name = document.getElementById('cli-nome').value;
            const phone = document.getElementById('cli-telefone').value;
            const cpf_cnpj = document.getElementById('cli-cpf').value;
            const cep = document.getElementById('cli-cep').value;
            const address = document.getElementById('cli-endereco').value;
            const number = document.getElementById('cli-numero').value;
            const neighborhood = document.getElementById('cli-bairro').value;
            const city = document.getElementById('cli-cidade').value;
            const state = document.getElementById('cli-uf').value;
            const reference_point = document.getElementById('cli-referencia').value;
            const notes = document.getElementById('cli-obs').value;

            try {
                const response = await fetch(`${workerBaseUrl}/clients`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        seller_id: currentUserId, 
                        name, phone, cpf_cnpj, cep, address, number, neighborhood, city, state, reference_point, notes 
                    })
                });

                if (response.ok) {
                    alert("Cliente salvo com sucesso!");
                    document.getElementById('form-cliente').reset(); 
                    carregarClientes(); 
                } else {
                    const erroData = await response.json();
                    alert("Erro real: " + (erroData.message || "Desconhecido"));
                }
            } catch (error) {
                alert("Erro de conexão: " + error.message);
            }
        }

        async function carregarClientes() {
            try {
                const response = await fetch(`${workerBaseUrl}/clients?seller_id=${currentUserId}`);
                const clientes = await response.json();

                const tbody = document.getElementById('lista-clientes');
                tbody.innerHTML = ''; 

                if (clientes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">Nenhum cliente cadastrado ainda.</td></tr>';
                    document.getElementById('total-clientes').innerText = "0";
                    return;
                }

                document.getElementById('total-clientes').innerText = clientes.length;

                clientes.forEach(cliente => {
                    const tr = document.createElement('tr');
                    const enderecoCompleto = [cliente.city, cliente.neighborhood].filter(Boolean).join(' / ');
                    
                    tr.innerHTML = `
                        <td><strong>${cliente.name}</strong></td>
                        <td>${cliente.phone || '-'}</td>
                        <td>${cliente.cpf_cnpj || '-'}</td>
                        <td>${enderecoCompleto || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Erro ao carregar clientes:", error);
            }
        }
    </script>
</body>
</html>
