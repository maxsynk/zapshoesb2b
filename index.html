<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAP SHOES - Portal do Vendedor</title>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #8A2BE2;
            text-align: center;
            width: 300px;
        }
        h1 { color: #8A2BE2; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #8A2BE2;
            background-color: #000;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #8A2BE2;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #6a1b9a; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>ZAP SHOES</h1>
        <p>Portal do Vendedor B2B</p>
        <input type="email" id="email" placeholder="E-mail" />
        <input type="password" id="password" placeholder="Senha" />
        <button onclick="login()">Entrar</button>
    </div>
    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // ATENÇÃO: Substitua a URL abaixo pela URL do Worker do Vendedor!
            const workerUrl = 'https://zapshoesb2b.maxcalcadosmax.workers.dev/login';

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Bem-vindo, ' + data.user.name + '!');
                    // Futuramente, redirecionaremos para o Dashboard do Vendedor
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Erro ao conectar com o servidor.');
            }
        }
    </script>
</body>
</html>
